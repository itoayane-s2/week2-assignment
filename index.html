<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>カフェメニュー</title>
        <script src="https://cdn.tailwindcss.com"></script>
    </head>

    <body class="bg-pink-50 ">

        <header class="bg-gray-500 mb-6 p-6 max-w-full rounded shadow flex items-center space-x-4">
            <img src="images/:Users:ai:week2-assignment:images.jpg" alt="カフェアイコン" class="w-24 h-24">
            <div>
                <h1 class="text-2xl font-bold text-white">HarborS カフェメニュー</h1>
                <h2 class="text-sm text-gray-300 mt-1">表参道駅 徒歩４分</h2>
            </div>
        </header>

        <main class="max-w-xl mx-auto px-4 py-8">
            <section class="mb-8">
                <h2 class="text-xl font-bold mb-4">ドリンク</h2>

                <div class="bg-pink-300 rounded shadow p-4 w-full mb-2">
                    <h1 class="font-bold text-white">ブレンドコーヒー</h1>
                    <p class="text-white">600円</p>
                </div>
                <div class="bg-pink-300 rounded shadow p-4 w-full mb-2">
                    <h1 class="font-bold text-white">カフェラテ</h1>
                    <p class="text-white">700円</p>
                </div>
                <div class="bg-pink-300 rounded shadow p-4 w-full mb-2">
                    <h1 class="font-bold text-white">カプチーノ</h1>
                    <p class="text-white">750円</p>
                </div>

                <div class="bg-pink-300 rounded shadow p-4 w-full mb-2">
                    <h1 class="font-bold text-white">ティー（hot/ice）</h1>
                    <p class="text-white">500円</p>
                </div>

                <h2 class="text-xl font-bold mb-4 mt-8">フード</h2>
                <div class="bg-pink-300 rounded shadow p-4 w-full mb-2">
                    <h1 class="font-bold text-white">アボカドサーモンサンド</h1>
                    <p class="text-white">1000円</p>
                </div>

                <div class="bg-pink-300 rounded shadow p-4 w-full mb-2">
                    <h1 class="font-bold text-white">クロックムッシュ</h1>  
                    <p class="text-white">900円</p>
                </div>
            </section>

            <p class="font-bold text-center bg-pink-200 rounded shadow p-4 w-full mb-2 hover:underline">注文方法</p>
        </main>

    </body>
</html>
